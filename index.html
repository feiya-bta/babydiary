<!DOCTYPE html>
<html lang="id" data-theme="strawberry" data-font="fredoka" data-mode="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFC2CE">
  <meta name="description" content="Catat pipis, BAB, ASI, dan susu formula si kecil dengan mudah.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>宝宝日记</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23FFC2CE'/%3E%3Cpath d='M16 8v16M8 16h16' stroke='%2333283A' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&family=Fredoka:wght@400;500;600;700&family=Kosugi+Maru&family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">

    <!-- ========== HALAMAN DATA (halaman awal) ========== -->
    <section class="view" id="view-day" hidden aria-label="Catatan harian" data-i18n-aria="ariaDay">
      <header class="topbar">
        <button class="icon-btn" id="btn-back" type="button" aria-label="Kembali ke kalender" data-i18n-aria="ariaBackCal"><span data-icon="back"></span></button>
        <div class="day-nav">
          <button class="icon-btn ghost" id="day-prev" type="button" aria-label="Hari sebelumnya" data-i18n-aria="ariaPrevDay"><span data-icon="left"></span></button>
          <div class="day-title" aria-live="polite">
            <strong id="day-title"></strong>
            <small id="day-sub"></small>
          </div>
          <button class="icon-btn ghost" id="day-next" type="button" aria-label="Hari berikutnya" data-i18n-aria="ariaNextDay"><span data-icon="right"></span></button>
        </div>
        <button class="icon-btn" id="btn-settings-day" type="button" aria-label="Pengaturan" data-i18n-aria="ariaSettings"><span data-icon="sliders"></span></button>
      </header>

      <!-- 4 ikon jenis catatan: muncul di paling atas saat tombol + ditekan -->
      <div class="chooser" id="chooser" aria-hidden="true" inert>
        <div class="chooser-inner">
          <div class="chooser-box" id="chooser-box" role="group" aria-label="Pilih jenis catatan" data-i18n-aria="chooseType"></div>
        </div>
      </div>

      <div class="content">
        <section class="baby-card" id="baby-card"></section>
        <section class="summary" id="summary" aria-label="Ringkasan hari ini" data-i18n-aria="ariaSummary"></section>
        <div class="section-head">
          <h2 data-i18n="history">Riwayat</h2>
          <span id="list-count"></span>
        </div>
        <div id="list"></div>
      </div>
    </section>

    <!-- ========== KALENDER ========== -->
    <section class="view" id="view-cal" hidden aria-label="Kalender" data-i18n-aria="ariaCalView">
      <header class="topbar">
        <div class="topbar-title"><h1 data-i18n="calendar">Kalender</h1></div>
        <button class="icon-btn" id="btn-settings-cal" type="button" aria-label="Pengaturan" data-i18n-aria="ariaSettings"><span data-icon="sliders"></span></button>
      </header>

      <div class="cal-card">
        <div class="cal-head">
          <button class="icon-btn" id="cal-prev" type="button" aria-label="Bulan sebelumnya" data-i18n-aria="ariaPrevMonth"><span data-icon="left"></span></button>
          <div class="cal-title" aria-live="polite">
            <span id="cal-month"></span>
            <small id="cal-sub"></small>
          </div>
          <button class="icon-btn" id="cal-next" type="button" aria-label="Bulan berikutnya" data-i18n-aria="ariaNextMonth"><span data-icon="right"></span></button>
        </div>
        <div class="cal-week" id="cal-week" aria-hidden="true"></div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>

      <div class="legend" id="legend"></div>
      <div class="today-card" id="today-card"></div>
    </section>

    <!-- ========== PENGATURAN ========== -->
    <section class="view" id="view-settings" hidden aria-label="Pengaturan" data-i18n-aria="ariaSettings">
      <header class="topbar">
        <button class="icon-btn" id="btn-back-settings" type="button" aria-label="Kembali" data-i18n-aria="ariaBack"><span data-icon="back"></span></button>
        <div class="topbar-title"><h1 data-i18n="settings">Pengaturan</h1></div>
      </header>
      <div class="content" id="settings-body"></div>
    </section>

  </main>

  <!-- Tombol tambah (kanan bawah) -->
  <div class="fab-wrap">
    <div class="fab-inner">
      <button id="fab" class="fab is-hidden" type="button" aria-label="Tambah catatan" aria-expanded="false">
        <span class="fab-icon" data-icon="plus"></span>
      </button>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <input type="file" id="photo-file" accept="image/*" hidden>

  <script src="app.js"></script>
</body>
</html>
